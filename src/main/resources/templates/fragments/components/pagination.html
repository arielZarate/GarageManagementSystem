<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="pagination(baseUrl, currentPage, totalPages, searchQuery, pageSize)">
    <div class="flex items-center justify-center gap-1 pt-3 pb-1">
        <!-- Previous -->
        <a th:if="${currentPage > 0}"
           th:href="@{${baseUrl}(q=${searchQuery}, page=${currentPage - 1}, size=${pageSize != null ? pageSize : 25})}"
           class="px-2 py-1 text-base border border-outline-variant rounded hover:bg-surface-container-low text-on-surface">
            &laquo;
        </a>
        <span th:if="${currentPage == 0}"
              class="px-2 py-1 text-sm border border-outline-variant rounded text-on-surface/30 cursor-not-allowed">&laquo;</span>

        <!-- Pages -->
        <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
            <a th:if="${i >= currentPage - 2 and i <= currentPage + 2}"
               th:href="@{${baseUrl}(q=${searchQuery}, page=${i}, size=${pageSize != null ? pageSize : 25})}"
               class="px-2 py-1 text-sm border border-outline-variant rounded hover:bg-surface-container-low"
               th:classappend="${i == currentPage} ? 'bg-primary text-on-primary border-primary' : 'text-on-surface'"
               th:text="${i + 1}">
            </a>
        </th:block>

        <!-- Next -->
        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{${baseUrl}(q=${searchQuery}, page=${currentPage + 1}, size=${pageSize != null ? pageSize : 25})}"
           class="px-2 py-1 text-sm border border-outline-variant rounded hover:bg-surface-container-low text-on-surface">
            &raquo;
        </a>
        <span th:if="${currentPage >= totalPages - 1}"
              class="px-2 py-1 text-sm border border-outline-variant rounded text-on-surface/30 cursor-not-allowed">&raquo;</span>
    </div>
</div>
</body>
</html>
