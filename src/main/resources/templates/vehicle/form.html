<div th:fragment="content" class="border border-outline-variant bg-surface-container rounded-md overflow-hidden">

    <!-- Header -->
    <div class="bg-surface-container px-4 py-2 border-b border-outline-variant flex items-center justify-between">
        <div class="flex items-center gap-2">
            <a th:href="@{/vehicle}"
               class="text-on-surface/60 hover:text-on-surface transition p-1 rounded hover:bg-surface-container-low">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </a>
            <h1 class="text-sm font-bold text-on-surface" th:text="${vehicle.id == null ? 'Nuevo Vehículo' : 'Editar Vehículo'}"></h1>
        </div>
    </div>

    <!-- Body -->
    <div class="p-4">

        <form th:action="${vehicle.id == null} ? @{/vehicle} : @{/vehicle/update}"
              th:object="${vehicle}"
              method="post"
              class="space-y-4 max-w-2xl">

            <input type="hidden" th:field="*{id}">

            <!-- Patente -->
            <div>
                <label class="block text-xs text-on-surface/60 mb-1">Patente *</label>
                <input type="text" th:field="*{licensePlate}"
                       class="w-full border border-outline-variant bg-surface-container-low text-on-surface px-2 py-1.5 text-xs focus:border-on-surface focus:outline-none rounded"
                       placeholder="Ej: ABC123" required>
            </div>

            <!-- Marca, Modelo, Versión -->
            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs text-on-surface/60 mb-1">Marca *</label>
                    <select th:field="*{brandId}"
                            class="w-full border border-outline-variant bg-surface-container-low text-on-surface px-2 py-1.5 text-xs focus:border-on-surface focus:outline-none rounded">
                        <option value="">Seleccionar...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-on-surface/60 mb-1">Modelo *</label>
                    <select th:field="*{modelId}"
                            class="w-full border border-outline-variant bg-surface-container-low text-on-surface px-2 py-1.5 text-xs focus:border-on-surface focus:outline-none rounded">
                        <option value="">Seleccionar...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-on-surface/60 mb-1">Versión</label>
                    <select th:field="*{versionId}"
                            class="w-full border border-outline-variant bg-surface-container-low text-on-surface px-2 py-1.5 text-xs focus:border-on-surface focus:outline-none rounded">
                        <option value="">Seleccionar...</option>
                    </select>
                </div>
            </div>

            <!-- Año y Tipo -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-on-surface/60 mb-1">Año *</label>
                    <input type="number" th:field="*{year}"
                           class="w-full border border-outline-variant bg-surface-container-low text-on-surface px-2 py-1.5 text-xs focus:border-on-surface focus:outline-none rounded"
                           placeholder="Ej: 2020" required>
                </div>
                <div>
                    <label class="block text-xs text-on-surface/60 mb-1">Tipo de vehículo</label>
                    <select th:field="*{vehicleType}"
                            class="w-full border border-outline-variant bg-surface-container-low text-on-surface px-2 py-1.5 text-xs focus:border-on-surface focus:outline-none rounded">
                        <option value="">Seleccionar...</option>
                        <option th:each="vt : ${vehicleTypes}"
                                th:value="${vt}"
                                th:text="${vt.displayName}"></option>
                    </select>
                </div>
            </div>

            <!-- Color y Combustible -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-on-surface/60 mb-1">Color</label>
                    <input type="text" th:field="*{color}"
                           class="w-full border border-outline-variant bg-surface-container-low text-on-surface px-2 py-1.5 text-xs focus:border-on-surface focus:outline-none rounded"
                           placeholder="Ej: Rojo">
                </div>
                <div>
                    <label class="block text-xs text-on-surface/60 mb-1">Combustible</label>
                    <select th:field="*{fuelType}"
                            class="w-full border border-outline-variant bg-surface-container-low text-on-surface px-2 py-1.5 text-xs focus:border-on-surface focus:outline-none rounded">
                        <option value="">Seleccionar...</option>
                        <option th:each="ft : ${fuelTypes}"
                                th:value="${ft}"
                                th:text="${ft.displayName}"></option>
                    </select>
                </div>
            </div>

            <!-- KM, Chasis, Motor -->
            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs text-on-surface/60 mb-1">Kilómetros</label>
                    <input type="number" th:field="*{kilometers}"
                           class="w-full border border-outline-variant bg-surface-container-low text-on-surface px-2 py-1.5 text-xs focus:border-on-surface focus:outline-none rounded"
                           placeholder="Ej: 50000">
                </div>
                <div>
                    <label class="block text-xs text-on-surface/60 mb-1">N° Chasis</label>
                    <input type="text" th:field="*{chassisNumber}"
                           class="w-full border border-outline-variant bg-surface-container-low text-on-surface px-2 py-1.5 text-xs focus:border-on-surface focus:outline-none rounded"
                           placeholder="Número de chasis">
                </div>
                <div>
                    <label class="block text-xs text-on-surface/60 mb-1">N° Motor</label>
                    <input type="text" th:field="*{engineNumber}"
                           class="w-full border border-outline-variant bg-surface-container-low text-on-surface px-2 py-1.5 text-xs focus:border-on-surface focus:outline-none rounded"
                           placeholder="Número de motor">
                </div>
            </div>

            <!-- Cliente (autocomplete) -->
            <div>
                <label class="block text-xs text-on-surface/60 mb-1">Cliente</label>
                <input type="hidden" th:field="*{customerId}" id="customerId">
                <div class="relative">
                    <input type="text" id="customerSearch"
                           class="w-full border border-outline-variant bg-surface-container-low text-on-surface px-2 py-1.5 text-xs focus:border-on-surface focus:outline-none rounded"
                           placeholder="Buscá por apellido, nombre o DNI..."
                           autocomplete="off">
                    <div id="customerResults"
                         class="absolute z-50 w-full mt-0.5 border border-outline-variant bg-surface-container rounded shadow-lg hidden max-h-48 overflow-y-auto"></div>
                </div>
            </div>

            <input type="hidden" id="customerSearchUrl" th:value="@{/customer/search}">

            <script>
                const customerInput = document.getElementById('customerSearch');
                const customerResults = document.getElementById('customerResults');
                const customerIdInput = document.getElementById('customerId');
                const customerSearchUrl = document.getElementById('customerSearchUrl').value;
                let selectedCustomerId = customerIdInput.value;
                let searchTimeout = null;

                customerInput.addEventListener('input', function() {
                    const q = this.value.trim();
                    if (q.length < 2) {
                        customerResults.classList.add('hidden');
                        return;
                    }

                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => {
                        fetch(customerSearchUrl + '?q=' + encodeURIComponent(q))
                            .then(r => r.json())
                            .then(data => {
                                customerResults.innerHTML = '';
                                if (data.length === 0) {
                                    customerResults.innerHTML = '<div class="px-2 py-2 text-xs text-on-surface/40">Sin resultados</div>';
                                } else {
                                    data.forEach(c => {
                                        const div = document.createElement('div');
                                        div.className = 'px-2 py-1.5 text-xs text-on-surface hover:bg-surface-container-low cursor-pointer border-b border-outline-variant/30';
                                        div.textContent = c.label;
                                        div.dataset.id = c.id;
                                        div.addEventListener('click', function() {
                                            customerInput.value = this.textContent;
                                            selectedCustomerId = this.dataset.id;
                                            customerIdInput.value = this.dataset.id;
                                            customerResults.classList.add('hidden');
                                        });
                                        customerResults.appendChild(div);
                                    });
                                }
                                customerResults.classList.remove('hidden');
                            });
                    }, 300);
                });

                // Cerrar al hacer clic fuera
                document.addEventListener('click', function(e) {
                    if (!e.target.closest('#customerSearch') && !e.target.closest('#customerResults')) {
                        customerResults.classList.add('hidden');
                    }
                });

                // Si perdió el foco sin seleccionar, limpiar
                customerInput.addEventListener('blur', function() {
                    setTimeout(() => {
                        if (!customerIdInput.value) {
                            customerInput.value = '';
                        }
                    }, 200);
                });
            </script>

            <!-- Botones -->
            <div class="flex items-center gap-2 justify-end pt-4 border-t border-outline-variant">
                <a th:href="@{/vehicle}"
                   class="border border-outline-variant text-on-surface px-4 py-1.5 text-xs rounded-sm hover:bg-surface-container-low">
                    Cancelar
                </a>
                <button type="submit"
                        class="bg-primary text-on-primary px-4 py-1.5 text-xs rounded-sm hover:bg-primary/80">
                    <span th:text="${vehicle.id == null} ? 'Guardar' : 'Actualizar'"></span>
                </button>
            </div>
        </form>
    </div>

</div>
